# ---- Switch here: local | prod ----
# Override with SPRING_PROFILES_ACTIVE env var in Railway
spring.profiles.active=prod 

# ---- Shared config ----
app.cors.allowed-origins=${ALLOWED_ORIGINS:https://teachingeval.netlify.app,https://teaching-evaluation.netlify.app,http://localhost:3000,http://localhost:5173}

# ---- Transactional email (Brevo API) ----
# Railway blocks outbound SMTP (587 and 465 both time out), so email goes
# through Brevo's HTTPS API instead of raw SMTP.
# BREVO_API_KEY must be set as an env var in Railway - never commit the key itself
brevo.api.key=${BREVO_API_KEY:}
brevo.sender.email=${BREVO_SENDER_EMAIL:teachingevaluationapplication@gmail.com}
brevo.sender.name=${BREVO_SENDER_NAME:Peer Lens}

mail.sender.name=${MAIL_SENDER_NAME:Peer Lens}

spring.jpa.defer-datasource-initialization=false
spring.sql.init.mode=never

logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
