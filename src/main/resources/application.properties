# ---- Switch here: local | prod ----
# Override with SPRING_PROFILES_ACTIVE env var in Railway
spring.profiles.active=prod 

# ---- Shared config ----
app.cors.allowed-origins=${ALLOWED_ORIGINS:https://teachingeval.netlify.app,https://teaching-evaluation.netlify.app,http://localhost:3000,http://localhost:5173}

# ---- Transactional email (Gmail SMTP) ----
# GMAIL_USERNAME / GMAIL_APP_PASSWORD must be set as env vars in Railway - never commit them
# Port/SSL/STARTTLS are overridable via env vars so we can test 465 (implicit SSL)
# vs 587 (STARTTLS) without a code change if one of them is blocked outbound.
spring.mail.host=smtp.gmail.com
spring.mail.port=${GMAIL_SMTP_PORT:465}
spring.mail.username=${GMAIL_USERNAME:}
spring.mail.password=${GMAIL_APP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=${GMAIL_SMTP_SSL:true}
spring.mail.properties.mail.smtp.starttls.enable=${GMAIL_SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtp.connectiontimeout=8000
spring.mail.properties.mail.smtp.timeout=8000
spring.mail.properties.mail.smtp.writetimeout=8000

mail.sender.name=${MAIL_SENDER_NAME:Peer Lens}

spring.jpa.defer-datasource-initialization=false
spring.sql.init.mode=never

logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
